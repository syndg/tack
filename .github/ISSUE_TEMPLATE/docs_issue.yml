name: Docs Issue
description: Report unclear, stale, or missing documentation.
title: "docs: "
labels: [docs]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: docs-site/content/docs/getting-started/index.mdx
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
