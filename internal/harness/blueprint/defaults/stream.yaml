name: "Stream Execution"
description: "Execute a single work stream: build, lint, review, merge_ready"

steps:
  - id: build
    type: agent
    role: builder
    description: "Implement the stream's task"
    commit: auto
    messages:
      commit: true
    next: lint

  - id: lint
    type: deterministic
    action: run_quality_gates
    retry: 2
    on_fail: build
    max_fix_iterations: 3
    next: review

  - id: review
    type: agent
    role: reviewer
    description: "Review the implementation"
    commit: none
    next: merge_ready

  - id: merge_ready
    type: deterministic
    action: signal_merge_ready
