name: "Hotfix"
description: "Single-agent fix with minimal ceremony"
trigger: "manual"

steps:
  - id: fix
    type: agent
    role: builder
    description: "Fix the issue in a single agent session"
    commit: auto
    next: lint

  - id: lint
    type: deterministic
    action: run_quality_gates
    retry: 2
    next: create_pr

  - id: create_pr
    type: deterministic
    action: create_pr
    next: complete

  - id: complete
    type: deterministic
    action: mark_complete
